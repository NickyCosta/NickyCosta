<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DD6C6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3DD6C6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#3DD6C6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes run { from { transform:translateX(-500px) } to { transform:translateX(500px) } }
    .dot { animation:run 6s ease-in-out infinite alternate }
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
  <rect x="0" y="11" width="1200" height="2" fill="url(#g)"/>
  <circle class="dot" cx="600" cy="12" r="3.5" fill="#F2B84B"/>
</svg>
